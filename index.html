<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rail Loop Companion</title>
<meta name="description" content="Berlin to Vienna and back: daily plan, route, bookings, phrases and spending.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rail Loop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --paper:#EDEFEA; --card:#FFFFFF; --ink:#1B1F27; --muted:#5B6270; --line:#D5D9D2;
  --de:#1E3A6B; --pl:#B3262D; --at:#16787A; --us:#6B6F78; --signal:#F2B705;
  --de-soft:#E3E9F3; --pl-soft:#F6E3E4; --at-soft:#DDEFEF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171C; --card:#1D2129; --ink:#ECEEF1; --muted:#A1A8B5; --line:#2E343F;
    --de:#7FA2E0; --pl:#EE7A7F; --at:#5CC4C5; --us:#9AA0AB;
    --de-soft:#1F2A3E; --pl-soft:#3A2225; --at-soft:#18322F;
  }
}
:root[data-theme="dark"]{
  --paper:#14171C; --card:#1D2129; --ink:#ECEEF1; --muted:#A1A8B5; --line:#2E343F;
  --de:#7FA2E0; --pl:#EE7A7F; --at:#5CC4C5; --us:#9AA0AB;
  --de-soft:#1F2A3E; --pl-soft:#3A2225; --at-soft:#18322F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;line-height:1.1;margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
/* App feel on iPhone: no text inflation, no grey tap flash, no zoom when a field is focused */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.btn,summary,nav.tabs{-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,select{font-size:16px}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:20px 18px 110px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 12px;font-family:"Barlow Condensed",Arial,sans-serif;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--signal)}

/* Today hero */
.hero{padding:6px 0 18px}
.hero .daynum{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:clamp(88px,26vw,140px);line-height:.85;letter-spacing:-2px}
.hero .daynum small{font-size:.28em;letter-spacing:0;font-weight:600;color:var(--muted);margin-left:6px}
.hero h1{font-size:clamp(30px,8vw,42px);margin-top:8px}
.hero .date{color:var(--muted);margin-top:4px}

/* Route strip */
.strip{overflow-x:auto;margin:6px -18px 18px;padding:0 18px}
.strip svg{display:block;min-width:560px;width:100%;height:auto}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h2{font-size:22px;margin-bottom:8px}
.leg{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.leg:first-of-type{border-top:0}
.leg .t{font-family:"Barlow Condensed",Arial,sans-serif;font-size:20px;font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.photos{display:flex;gap:10px;overflow-x:auto;margin:4px 0 12px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos figure{margin:0;flex:1 0 62%;min-width:0}
.photos img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:var(--line)}
.photos figcaption{margin-top:4px}
.sight{padding:10px 0;border-top:1px solid var(--line)}
.sight:first-child{border-top:0;padding-top:0}
.sight b{font-weight:600}
.flag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:1px;background:var(--signal);color:#1B1F27}
.note{border-left:4px solid var(--signal);padding:8px 12px;background:var(--card);border-radius:0 10px 10px 0;margin:10px 0}

/* Route tab: vertical line */
.line{position:relative;padding-left:34px}
.line::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:6px;border-radius:3px;background:linear-gradient(var(--de) 0 45%, var(--pl) 45% 72%, var(--at) 72% 84%, var(--de) 84% 100%)}
.stop{position:relative;margin-bottom:10px}
.stop::before{content:"";position:absolute;left:-30px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--card);border:4px solid var(--c,var(--de))}
.stop.now::before{background:var(--signal)}
.stop details{background:var(--card);border:1px solid var(--line);border-radius:12px}
.stop summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:baseline}
.stop summary::-webkit-details-marker{display:none}
.stop .dn{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:26px;min-width:30px;color:var(--c)}
.stop .st{flex:1}
.stop .st h3{font-size:20px}
.stop .body{padding:0 14px 14px}
.chip{display:inline-block;font-size:13px;padding:1px 8px;border-radius:6px;background:var(--soft,var(--de-soft));color:var(--c,var(--de));font-weight:600}

/* Map tab: fills the screen between the header and the tab bar */
main.maptab{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-bottom:62px}
.jump{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px 2px;scrollbar-width:none;flex:none}
.jump::-webkit-scrollbar{display:none}
.jump .btn{flex:none;white-space:nowrap}
.jump .btn:not(.primary){background:var(--card)}
.mapbox{position:relative;flex:1;min-height:260px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#map{position:absolute;inset:0}
.mapmsg{position:absolute;left:10px;top:10px;z-index:500;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:0 8px 8px 0;padding:5px 10px;font-size:13px;max-width:calc(100% - 70px)}
.mapmsg:empty{display:none}
.leaflet-container{background:var(--paper);font:inherit;color:var(--ink)}
.leaflet-container a{color:inherit}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-control-attribution{background:var(--card)!important;color:var(--muted);font-size:10px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink);box-shadow:0 2px 12px rgba(0,0,0,.25)}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:12px 14px;font-size:15px;line-height:1.4;min-width:170px}
.leaflet-popup-content h3{font-size:20px;margin-bottom:2px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.bd{fill:var(--card);fill-opacity:1;stroke:var(--line);stroke-width:1.5}
.bd-DEU{fill:var(--de-soft)} .bd-POL{fill:var(--pl-soft)} .bd-AUT{fill:var(--at-soft)}
.rt{fill:none;stroke-width:5;stroke-linecap:round;stroke:var(--c)}
.rt.side{stroke-width:3;stroke-dasharray:2 8}
.pin{display:flex;align-items:center;justify-content:center}
.pin i{display:block;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pin.p-city i{width:20px;height:20px;background:var(--card);border:5px solid var(--c)}
.pin.p-city.p-now i{background:var(--signal)}
.pin.p-sight i{width:14px;height:14px;background:var(--c);border:2px solid #fff}
.pin.p-extra i{width:13px;height:13px;background:#fff;border:3px solid var(--c);border-radius:2px;transform:rotate(45deg)}
.pin.p-me i{width:16px;height:16px;background:#1E88E5;border:3px solid #fff;box-shadow:0 0 0 6px rgba(30,136,229,.25)}
.leaflet-tooltip.city{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;font-size:14px;box-shadow:none}
.leaflet-tooltip.city::before{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}

/* Checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--de);flex:none}
.check.done .lbl{text-decoration:line-through;color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--de)}

/* Phrases */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:999px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.phr{padding:10px 0;border-top:1px solid var(--line)}
.phr:first-child{border-top:0}
.phr .src{font-family:"Barlow Condensed",Arial,sans-serif;font-size:21px;font-weight:600}
.phr .say{font-size:14px;color:var(--muted);font-style:italic}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sign{background:var(--de);color:#fff;border-radius:8px;padding:10px 12px}
.sign.pl{background:var(--pl)}
.sign b{display:block;font-family:"Barlow Condensed",Arial,sans-serif;font-size:21px;font-weight:600}
.sign span{font-size:14px;opacity:.9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sign{color:#14171C}}
:root[data-theme="dark"] .sign{color:#14171C}

/* Money */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=number],input[type=text],input[type=date],select{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.big{font-family:"Barlow Condensed",Arial,sans-serif;font-size:40px;font-weight:700;line-height:1}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 4px;border-top:1px solid var(--line)}
td.r{text-align:right;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}
.tablewrap{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){ .fade{animation:fade .25s ease-out} @keyframes fade{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<main id="app" class="fade"></main>
<nav class="tabs" aria-label="Sections"><div class="inner" role="tablist">
  <button role="tab" data-tab="today">Today</button>
  <button role="tab" data-tab="route">Route</button>
  <button role="tab" data-tab="map">Map</button>
  <button role="tab" data-tab="book">To book</button>
  <button role="tab" data-tab="words">Words</button>
  <button role="tab" data-tab="money">Money</button>
</div></nav>

<script src="vendor/leaflet.js"></script>
<script src="vendor/borders.js"></script>
<script src="photos/credits.js"></script>

function tripDay(){
  if(!S.start) return null;
  const s=new Date(S.start+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0);
  return Math.round((t-s)/86400000)+1;
}
function dateFor(n){
  if(!S.start) return '';
  const d=new Date(S.start+'T00:00:00'); d.setDate(d.getDate()+n-1);
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
function isSunday(n){ if(!S.start) return false; const d=new Date(S.start+'T00:00:00'); d.setDate(d.getDate()+n-1); return d.getDay()===0; }
function isMonday(n){ if(!S.start) return false; const d=new Date(S.start+'T00:00:00'); d.setDate(d.getDate()+n-1); return d.getDay()===1; }
const col = c => 'var(--'+CC[c]+')';
const soft = c => c==='US'?'var(--line)':'var(--'+CC[c]+'-soft)';

/* ---------- Route strip ---------- */
function strip(cur){
  const W=620,H=86,pad=24,step=(W-pad*2)/(STOPS.length-1);
  let idx=-1; if(cur) STOPS.forEach((s,i)=>{ if(s[1]<=cur) idx=i; });
  let segs='',dots='',labels='';
  STOPS.forEach((s,i)=>{
    const x=pad+i*step;
    if(i<STOPS.length-1){
      const x2=x+step; const c=STOPS[i+1][2]===s[2]?s[2]:STOPS[i+1][2];
      segs+=`<line x1="${x}" y1="34" x2="${x2}" y2="34" stroke="${col(c)}" stroke-width="6" stroke-linecap="round" opacity="${idx>=0&&i>=idx?0.35:1}"/>`;
    }
    const here=i===idx;
    dots+=`<circle cx="${x}" cy="34" r="${here?10:7}" fill="${here?'var(--signal)':'var(--card)'}" stroke="${col(s[2])}" stroke-width="4"/>`;
    labels+=`<text x="${x}" y="${i%2?70:62}" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-size="14" font-weight="${here?700:500}" fill="var(--ink)">${s[0]}</text>`;
  });
  return `<div class="strip" aria-label="Route progress"><svg viewBox="0 0 ${W} ${H}" role="img">${segs}${dots}${labels}</svg></div>`;
}

/* ---------- Day detail ---------- */
function dayBody(d){
  let legs=[...d.legs], sights=[...d.sights];
  if(d.choice && S.choice){ sights.push(CHOICE[S.choice]); legs.push(CHOICE[S.choice].leg); }
  let h='';
  if(d.plan) h+=`<p style="margin:0 0 10px">${esc(d.plan)}</p>`;
  if(PHOTOS[d.n]) h+=`<div class="photos">${PHOTOS[d.n].map(p=>`<figure><img src="photos/${p[0]}.jpg" alt="${esc(p[1])}" loading="lazy"><figcaption class="small muted">${esc(p[1])}</figcaption></figure>`).join('')}</div>`;
  if(isSunday(d.n)) h+=`<div class="note small">This day is a Sunday. Most shops will be closed; buy food and essentials the day before.</div>`;
  if(d.choice){
    h+=`<div class="panel" style="background:var(--paper)"><h2 style="font-size:19px">Pick one for this afternoon</h2><div class="seg" role="group" aria-label="Day 13 choice">
      <button data-choice="dachau" aria-pressed="${S.choice==='dachau'}">Dachau Memorial</button>
      <button data-choice="neu" aria-pressed="${S.choice==='neu'}">Neuschwanstein</button></div>
      ${S.choice==='dachau'&&isMonday(13)?'<div class="note small">Day 13 falls on a Monday, when the Dachau Memorial is closed. Consider swapping.</div>':''}
      ${S.choice?'':'<p class="small muted" style="margin:0">Your choice adds directions and a booking reminder.</p>'}</div>`;
  }
  if(legs.length){
    h+=`<h3 class="cond" style="font-size:18px;margin:12px 0 2px">Getting there</h3>`;
    legs.forEach(l=>{
      h+=`<div class="leg"><div style="flex:1"><div class="t">${esc(l.a)} to ${esc(l.b)}</div><div class="small muted">${esc(l.mode)}, ${esc(l.dur)}</div>
      ${l.flight?'':`<div class="btnrow"><a class="btn primary" target="_blank" rel="noopener" href="${dir(l.a,l.b)}">Directions</a><a class="btn" target="_blank" rel="noopener" href="https://int.bahn.de/en">Check times on bahn.de</a></div>`}</div></div>`;
    });
  }
  if(sights.length){
    h+=`<h3 class="cond" style="font-size:18px;margin:14px 0 8px">Sights</h3>`;
    sights.forEach(s=>{
      h+=`<div class="sight"><b>${esc(s.s)}</b>${s.book?'<span class="flag">Book ahead</span>':''}${s.n?`<div class="small muted">${esc(s.n)}</div>`:''}
      <div class="btnrow"><a class="btn" target="_blank" rel="noopener" href="${g(s.q)}">Open in Maps</a></div></div>`;
    });
  }
  if(d.tips.length){
    h+=`<h3 class="cond" style="font-size:18px;margin:14px 0 4px">Worth knowing</h3>`;
    d.tips.forEach(t=>h+=`<div class="note small">${esc(t)}</div>`);
  }
  if(d.night) h+=`<p class="small muted" style="margin:12px 0 0">Overnight in ${esc(d.night)}.</p>`;
  return h;
}

    h+=`<div class="panel"><h2>${esc(gp)}</h2>`;
    all.filter(b=>b.grp===gp).forEach(b=>{
      h+=`<div class="check ${S.done[b.id]?'done':''}"><input type="checkbox" id="c_${b.id}" data-check="${b.id}" ${S.done[b.id]?'checked':''}><div style="flex:1"><label for="c_${b.id}" class="lbl">${esc(b.t)}</label>${b.u?`<div><a class="small" target="_blank" rel="noopener" href="${esc(b.u)}">Booking site</a></div>`:''}</div>${b.custom?`<button class="x" aria-label="Remove" data-rmc="${b.id}">×</button>`:''}</div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="panel"><h2>Add your own</h2><div class="row"><input id="newb" type="text" placeholder="e.g. Bratislava day trip tickets" style="flex:1"><button class="btn primary" id="addb">Add</button></div></div>`;
  return h;
}

function vWords(){
  const L=S.lang;
  let h=`<h1 style="font-size:36px;margin:4px 0 12px">Words</h1><div class="seg" role="group" aria-label="Language">
   <button data-lang="de" aria-pressed="${L==='de'}">German</button><button data-lang="pl" aria-pressed="${L==='pl'}">Polish (days 7–10)</button><button data-lang="signs" aria-pressed="${L==='signs'}">Signs</button></div>`;
  if(L==='signs'){
    h+=`<p class="muted small" style="margin-top:0">What you will see at stations and shop doors. Blue is German, red is Polish.</p><div class="signs">${SIGNS.map(s=>`<div class="sign ${s[2]==='pl'?'pl':''}"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('')}</div>`;
    h+=`<div class="panel" style="margin-top:14px"><h2>Country tips</h2>${['DE','PL','AT'].map(c=>`<h3 class="cond" style="font-size:18px;margin:10px 0 4px;color:${col(c)}">${{DE:'Germany',PL:'Poland',AT:'Austria'}[c]}</h3>${COUNTRY_TIPS[c].map(t=>`<div class="note small">${esc(t)}</div>`).join('')}`).join('')}</div>`;
  } else {
    h+=`<div class="panel">${PHRASES[L].map(p=>`<div class="phr"><div class="src">${esc(p[0])}</div><div>${esc(p[1])}</div><div class="say">${esc(p[2])}</div></div>`).join('')}</div>`;
    if(L==='de') h+=`<p class="small muted">In Austria and Bavaria, "Grüß Gott" (hello) and "Servus" (hi / bye) are everywhere.</p>`;
  }
  return h;
}

function vMoney(){
  const r=S.rates;
  const toUSD=(a,c)=>c==='USD'?a:a*(r[c]||0);
  const byC={DE:0,PL:0,AT:0,other:0}; let total=0;
  S.spend.forEach(x=>{const u=toUSD(+x.a,x.c); total+=u; byC[x.k||'other']=(byC[x.k||'other']||0)+u;});
  let h=`<h1 style="font-size:36px;margin:4px 0 12px">Money</h1>
  <div class="panel"><h2>Quick convert</h2><div class="row"><input id="cvA" type="number" inputmode="decimal" value="10" style="width:110px" aria-label="Amount"><select id="cvC" aria-label="Currency"><option value="EUR">EUR €</option><option value="PLN">PLN zł</option></select><span class="big" id="cvOut"></span></div>
  <p class="small muted">Germany and Austria use euros. Poland (days 7–10) uses złoty.</p>
  <details><summary class="small">Edit exchange rates</summary><div class="row" style="margin-top:8px"><label class="small">1 EUR = $<input id="rE" type="number" step="0.01" value="${r.EUR}" style="width:80px"></label><label class="small">1 PLN = $<input id="rP" type="number" step="0.01" value="${r.PLN}" style="width:80px"></label><button class="btn" id="saveR">Save rates</button></div><p class="small muted">These are set by hand, so update them with today's rate from your bank.</p></details></div>
  <div class="panel"><h2>Spending</h2><div class="big">$${total.toFixed(0)}</div><p class="small muted" style="margin:4px 0 12px">Germany $${byC.DE.toFixed(0)}, Poland $${byC.PL.toFixed(0)}, Austria $${byC.AT.toFixed(0)}</p>
  <div class="row"><input id="spN" type="text" placeholder="What" style="flex:2;min-width:120px"><input id="spA" type="number" inputmode="decimal" placeholder="Amount" style="width:100px"><select id="spC"><option>EUR</option><option>PLN</option><option>USD</option></select><button class="btn primary" id="addS">Add</button></div>
  ${S.spend.length?`<div class="tablewrap"><table style="margin-top:12px">${S.spend.slice().reverse().map(x=>`<tr><td>${esc(x.n)}<div class="small muted">Day ${x.d||'–'}</div></td><td class="r">${esc((+x.a).toFixed(2))} ${esc(x.c)}<div class="small muted">$${toUSD(+x.a,x.c).toFixed(2)}</div></td><td class="r"><button class="x" aria-label="Delete" data-rms="${x.id}">×</button></td></tr>`).join('')}</table></div>`:'<p class="small muted">No spending logged yet. Add your first coffee.</p>'}
  </div>`;
  return h;
}

/* ---------- Map ---------- */
let map=null, mapView=null, meMarker=null, focusDay=null;
const TRIP_BOUNDS=[[47.4,10.6],[52.7,20.1]];
// Which side each city label sits on, so neighbours do not overlap when zoomed out
const LABEL_DIR={Potsdam:'left',Wittenberg:'left',Leipzig:'left',Vienna:'bottom',Munich:'bottom'};
const LABEL_OFF={top:[0,-10],bottom:[0,10],left:[-10,0]};
function vMap(){
  return `<h1 style="font-size:36px;margin:4px 0 12px">Map</h1>
  <div class="jump" role="group" aria-label="Jump to"><button class="btn primary" data-jump="me">My location</button><button class="btn" data-jump="all">Whole trip</button>${STOPS.map((s,i)=>`<button class="btn" data-jump="${i}">${esc(s[0])}</button>`).join('')}</div>
  <div class="mapbox"><div id="map" role="application" aria-label="Trip map"></div><div class="mapmsg" id="mapmsg" role="status"></div></div>`;
}
function stopDays(name){
  const ds=DAYS.filter(d=>d.place.includes(name)||d.night===name).map(d=>d.n);
  return ds.length>1?`Days ${ds[0]}–${ds[ds.length-1]}`:`Day ${ds[0]}`;
}
function pin(kind,c){ return L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-10],html:`<div class="pin ${kind}" style="width:34px;height:34px;--c:${c}"><i></i></div>`}); }
function popup(title,sub,day,q){
  const el=document.createElement('div');
  el.innerHTML=`<h3>${esc(title)}</h3><div class="small muted">${esc(sub)}</div><div class="btnrow"><button class="btn primary">See day ${day}</button>${q?`<a class="btn" target="_blank" rel="noopener" href="${g(q)}">Open in Maps</a>`:''}</div>`;
  el.querySelector('button').addEventListener('click',()=>{ focusDay=day; S.tab='route'; save(); render(); const s=document.getElementById('day'+day); if(s) s.scrollIntoView({block:'start'}); focusDay=null; });
  return el;
}
function mapMsg(t){ const m=document.getElementById('mapmsg'); if(m) m.textContent=t||(navigator.onLine?'':'No signal: showing the route, pins and any streets you have already viewed.'); }
function closeMap(){ if(!map) return; try{ mapView={c:map.getCenter(),z:map.getZoom()}; }catch(e){} map.remove(); map=null; meMarker=null; }
function initMap(){
  const td=tripDay(); let idx=-1; if(td>=1&&td<=14) STOPS.forEach((s,i)=>{ if(s[1]<=td) idx=i; });
  map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:4,maxBounds:[[40,0],[58,30]]});
  map.attributionControl.setPrefix(false);
  if(mapView) map.setView(mapView.c,mapView.z);
  else if(idx>=0) map.setView(STOP_GEO[STOPS[idx][0]],12);
  else map.fitBounds(TRIP_BOUNDS);
  // Country outlines sit under the street tiles, so the map still reads with no signal.
  map.createPane('base').style.zIndex=100;
  L.geoJSON(BORDERS,{pane:'base',interactive:false,style:f=>({className:'bd bd-'+f.id})}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);

  const line=(a,b,c,side)=>L.polyline([a,b],{className:'rt'+(side?' side':''),interactive:false}).addTo(map).getElement().style.setProperty('--c',col(c));
  // Potsdam is a day trip out of Berlin, so it hangs off the main line as a dashed spur.
  const main=STOPS.filter(s=>s[0]!=='Potsdam');
  main.forEach((s,i)=>{ if(i) line(STOP_GEO[main[i-1][0]],STOP_GEO[s[0]],s[2]); });
  line(STOP_GEO['Berlin'],STOP_GEO['Potsdam'],'DE',true);
  line(STOP_GEO['Kraków'],GEO['Auschwitz I Museum Oświęcim'],'PL',true);
  if(S.choice) line(STOP_GEO['Munich'],GEO[CHOICE[S.choice].q],'DE',true);

  const cities=L.layerGroup(), sights=L.layerGroup();
  STOPS.forEach((s,i)=>{
    L.marker(STOP_GEO[s[0]],{icon:pin('p-city'+(i===idx?' p-now':''),col(s[2])),zIndexOffset:500,title:s[0]})
      .bindPopup(popup(s[0],stopDays(s[0]),s[1])).bindTooltip(s[0],{permanent:true,direction:LABEL_DIR[s[0]]||'top',offset:LABEL_OFF[LABEL_DIR[s[0]]||'top'],className:'city'}).addTo(cities);
  });
  DAYS.forEach(d=>{
    const list=d.choice&&S.choice?d.sights.concat(CHOICE[S.choice]):d.sights;
    list.forEach(x=>{ if(GEO[x.q]) L.marker(GEO[x.q],{icon:pin('p-sight',col(d.c)),title:x.s}).bindPopup(popup(x.s,'Day '+d.n+(x.n?'. '+x.n:''),d.n,x.q)).addTo(sights); });
  });
  EXTRAS.forEach(x=>L.marker(x.ll,{icon:pin('p-extra',col(x.c)),title:x.s}).bindPopup(popup(x.s,'Not in the plan. '+x.dist+'. '+x.n,x.d,x.q)).addTo(sights));
  // Zoomed out you see the loop and city names; zoom in and the sights take over.
  const layers=()=>{ const near=map.getZoom()>=9; near?(map.addLayer(sights),map.removeLayer(cities)):(map.addLayer(cities),map.removeLayer(sights)); };
  map.on('zoomend',layers);
  map.on('locationfound',e=>{ if(meMarker) meMarker.remove(); meMarker=L.marker(e.latlng,{icon:pin('p-me',''),zIndexOffset:1000,interactive:false}).addTo(map); mapMsg(''); });
  map.on('locationerror',()=>mapMsg('Could not get your location. Check that location access is allowed for this app.'));

  layers(); mapMsg('');
}
function jump(v){
  if(!map) return;
  if(v==='all') map.fitBounds(TRIP_BOUNDS);
  else if(v==='me'){ mapMsg('Finding you…'); map.locate({setView:true,maxZoom:15,enableHighAccuracy:true,timeout:15000}); }
  else map.setView(STOP_GEO[STOPS[+v][0]],13);
}
window.addEventListener('online',()=>mapMsg(''));
window.addEventListener('offline',()=>mapMsg(''));

/* ---------- Render + events ---------- */
const VIEWS={today:vToday,route:vRoute,map:vMap,book:vBook,words:vWords,money:vMoney};
function render(){
  const app=document.getElementById('app');
  closeMap();
  app.innerHTML=VIEWS[S.tab]();
  app.classList.toggle('maptab',S.tab==='map');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  if(S.tab==='money') convert();
  if(S.tab==='map') initMap();
}
function convert(){
  const a=+document.getElementById('cvA').value||0, c=document.getElementById('cvC').value;
  document.getElementById('cvOut').textContent='$'+(a*S.rates[c]).toFixed(2);
}
function curCountry(){ const t=tripDay(); if(!t||t<1||t>14) return 'other'; const d=DAYS[t-1]; return d.c==='US'?'other':d.c; }

document.querySelector('nav.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  S.tab=b.dataset.tab; save(); render(); window.scrollTo(0,0);
});
document.getElementById('app').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='setd'||t.id==='setd2'){ const v=document.getElementById(t.id==='setd'?'sd':'sd2').value; if(v){S.start=v;save();render();} }
  if(t.dataset.go){ S.tab=t.dataset.go; save(); render(); window.scrollTo(0,0); }
  if(t.dataset.jump) jump(t.dataset.jump);
  if(t.dataset.choice){ S.choice=S.choice===t.dataset.choice?'':t.dataset.choice; save(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  if(t.dataset.lang){ S.lang=t.dataset.lang; save(); render(); }
  if(t.dataset.rmc){ S.custom=S.custom.filter(b=>b.id!==t.dataset.rmc); delete S.done[t.dataset.rmc]; save(); render(); }
  if(t.id==='addb'){ const v=document.getElementById('newb').value.trim(); if(v){ S.custom.push({id:'u'+Date.now(),t:v,grp:'Your additions',custom:true}); save(); render(); } }
  if(t.id==='saveR'){ const e1=+document.getElementById('rE').value, p1=+document.getElementById('rP').value; if(e1>0)S.rates.EUR=e1; if(p1>0)S.rates.PLN=p1; save(); render(); }
  if(t.id==='addS'){
    const n=document.getElementById('spN').value.trim()||'Expense', a=parseFloat(document.getElementById('spA').value), c=document.getElementById('spC').value;
    if(a>0){ const td=tripDay(); S.spend.push({id:'s'+Date.now(),n,a,c,k:curCountry(),d:(td>=1&&td<=14)?td:''}); save(); render(); }
  }
  if(t.dataset.rms){ S.spend=S.spend.filter(x=>x.id!==t.dataset.rms); save(); render(); }
});
document.getElementById('app').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.check){ S.done[t.dataset.check]=t.checked; save(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  if(t.id==='spC'){ /* keep selection */ }
});
document.getElementById('app').addEventListener('input',e=>{ if(e.target.id==='cvA'||e.target.id==='cvC') convert(); });
document.getElementById('app').addEventListener('change',e=>{ if(e.target.id==='cvC') convert(); });
render();

/* ---------- Installed-app behaviour ---------- */
// The app stays suspended in the background for days, so roll over to the new day when it is reopened.
let shownDay=tripDay();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  const now=tripDay(); if(now!==shownDay){ shownDay=now; render(); }
});
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
// Ask iOS not to clear the saved checklist and spending log.
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
</body>
